[package]
name = "sophiequant"
version = "0.1.0"
edition = "2021"

[features]
# Por defecto la app sirve la interfaz embebida en el propio binario.
# `tauri dev` arranca con `--no-default-features`, que es lo que hace que en
# desarrollo use el servidor de Vite en localhost:1420.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
tauri-plugin-dialog = "2.8.3"

[profile.release]
lto = true
codegen-units = 1
