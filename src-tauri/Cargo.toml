[package]
name = "sophiequant"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
tauri-plugin-dialog = "2.8.3"

[profile.release]
lto = true
codegen-units = 1
